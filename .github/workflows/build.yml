name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64-musl-static
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            make_target: arm64-static-musl
            dockerfile: Dockerfile.arm64-static-musl
            artifact_name: bun-linux-aarch64-musl-static
          - name: linux-x86_64-musl-static
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
            make_target: x86_84-static-musl
            dockerfile: Dockerfile.x86_84-static-musl
            artifact_name: bun-linux-x86_64-musl-static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - name: Free runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /opt/hostedtoolcache \
            "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Fetch source
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/bun-musl-build"
          source_dir="$work_dir/source"
          mkdir -p "$work_dir"

          git init "$source_dir"
          git -C "$source_dir" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$source_dir" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Cache Linux BuildKit mounts
        id: buildkit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bun-musl-build/buildkit-cache
          key: bun-musl-buildkit-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            bun-musl-buildkit-${{ matrix.arch }}-

      - name: Restore Linux BuildKit mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/bun-musl-build/buildkit-cache
          dockerfile: ${{ runner.temp }}/bun-musl-build/source/${{ matrix.dockerfile }}
          skip-extraction: ${{ steps.buildkit-cache.outputs.cache-hit }}

      - name: Build and smoke-test the artifact
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/bun-musl-build"
          artifact_dir="$work_dir/artifact"
          archive_dir="$work_dir/archive"
          artifact_name="${{ matrix.artifact_name }}"
          mkdir -p "$artifact_dir" "$archive_dir"

          cd "$work_dir/source"
          DOCKER_BUILD="docker buildx build --builder ${{ steps.buildx.outputs.name }}" \
          DOCKER_BUILD_CACHE_ARGS='--cache-from type=gha,scope=bun-musl-${{ matrix.arch }} --cache-to type=gha,mode=max,scope=bun-musl-${{ matrix.arch }}' \
          make "${{ matrix.make_target }}" BUN_LTO=off

          artifact="$artifact_dir/$artifact_name"
          cp dist/bun "$artifact"
          test -x "$artifact"
          file "$artifact"
          test -z "$(readelf -lW "$artifact" | awk '/INTERP/{print}')"
          test -z "$(readelf -dW "$artifact" | awk '/NEEDED/{print}')"

          docker run --rm --platform="${{ matrix.platform }}" \
            -v "$artifact:/tmp/bun:ro" \
            alpine:3.23@sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63 sh -ec '
              apk add --no-cache binutils file >/dev/null
              file /tmp/bun
              test -z "$(readelf -lW /tmp/bun | awk "/INTERP/{print}")"
              test -z "$(readelf -dW /tmp/bun | awk "/NEEDED/{print}")"
              /tmp/bun --version
              test "$(/tmp/bun -e "console.log(40 + 2)")" = 42
              /tmp/bun -e '\''const { heapStats } = require("bun:jsc"); const s = heapStats(); if (!s.mimalloc || s.mimalloc.mimalloc_version <= 3000 || s.mimalloc.pages.current <= 0 || s.mimalloc.committed.current <= 0) throw new Error("mimalloc stats missing")'\''
            '

          zip -9 -j "$archive_dir/$artifact_name.zip" "$artifact"
          test -s "$archive_dir/$artifact_name.zip"

      - name: Upload ${{ matrix.name }} ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/bun-musl-build/archive/*.zip
          if-no-files-found: error

  publish:
    name: Publish static artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_name="bun-${GITHUB_SHA}-static"
          if gh release view "$release_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $release_name already exists" >&2
            exit 1
          fi

          publish_dir="$RUNNER_TEMP/publish"
          mkdir -p "$publish_dir"
          mapfile -d '' release_files < <(find artifacts -type f -name '*.zip' -print0 | sort -z)
          test "${#release_files[@]}" -eq 2
          expected_assets=(
            bun-linux-aarch64-musl-static.zip
            bun-linux-x86_64-musl-static.zip
          )
          actual_assets=()
          for release_file in "${release_files[@]}"; do
            actual_assets+=("$(basename "$release_file")")
            unzip -tq "$release_file"
            cp "$release_file" "$publish_dir/"
          done
          diff -u \
            <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${actual_assets[@]}" | LC_ALL=C sort)
          (
            cd "$publish_dir"
            sha256sum ./*.zip | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          gh release create "$release_name" \
            "$publish_dir"/*.zip \
            "$publish_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_name" \
            --notes "Static Linux aarch64 and x86_64 musl Bun artifacts built from $GITHUB_SHA." \
            --prerelease
